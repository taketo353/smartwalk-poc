plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.smartwalk.poc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartwalk.poc'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
