<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>路面の凍結情報 | SmartWalk</title>
  <link rel="stylesheet" href="/web/styles.css">
  <script src="/web/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-content">
      <a class="brand" href="/student"><span class="brand-mark" aria-hidden="true"></span>SmartWalk</a>
      <nav aria-label="表示切り替え">
        <a id="student-link" href="/student" aria-current="page">学生向け</a>
        <a id="admin-link" href="/admin">大学向け</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <div class="page-intro">
      <h1 id="page-title">路面の凍結情報</h1>
      <p>試験運用中の参考情報です。通行前に現地の路面を確認してください。</p>
    </div>
    <noscript><p class="notice">観測データを表示するには JavaScript を有効にしてください。</p></noscript>

    <div class="overview">
      <section class="card risk-panel" id="risk-panel" data-risk="unknown" aria-labelledby="risk-heading">
        <h2 id="risk-heading">現在の凍結リスク</h2>
        <div role="status">
          <div class="risk-value">
            <span class="risk-icon" id="risk-icon" aria-hidden="true">?</span>
            <span id="risk-level">判定不明</span>
          </div>
          <p id="risk-reason" class="risk-reason">観測データを取得中です。</p>
        </div>
        <p class="observed">観測時刻 <time id="observation-time">未取得</time></p>
        <p id="sample-notice" class="sample-notice" hidden></p>
      </section>

      <section class="card location-panel" aria-labelledby="location-heading">
        <h2 id="location-heading">観測地点</h2>
        <p class="location-name">角間坂（デモ地点）</p>
        <figure class="locator">
          <div class="locator-art" aria-hidden="true">
            <span class="path-edge"></span>
            <span class="path-center"></span>
            <span class="locator-point"></span>
          </div>
          <figcaption>観測地点の模式図</figcaption>
        </figure>
      </section>
    </div>

    <div id="admin-view" hidden>
      <section class="card details" aria-labelledby="detail-heading">
        <h2 id="detail-heading">観測値と入力元</h2>
        <dl class="details-grid">
          <div><dt>地点 ID</dt><dd id="location-id">—</dd></div>
          <div><dt>路面温度</dt><dd id="surface-temperature">—</dd></div>
          <div><dt>温度の取得元</dt><dd id="temperature-source">—</dd></div>
          <div><dt>路面ラベル</dt><dd id="surface-label">—</dd></div>
          <div><dt>ラベルの取得元</dt><dd id="vision-source">—</dd></div>
          <div><dt>画像の取得元</dt><dd id="image-source">—</dd></div>
          <div><dt>画像 ID</dt><dd id="image-id">—</dd></div>
        </dl>
      </section>

      <section class="card details" aria-labelledby="history-heading">
        <h2 id="history-heading">観測履歴</h2>
        <p id="history-state" class="history-state" role="status">観測履歴を取得中です。</p>
        <div id="history-table" class="table-scroll" tabindex="0" role="region" aria-labelledby="history-heading" hidden>
          <table>
            <thead>
              <tr><th scope="col">観測時刻</th><th scope="col">凍結リスク</th><th scope="col">路面温度・取得元</th><th scope="col">路面ラベル・取得元</th><th scope="col">画像の取得元</th><th scope="col">判定理由</th></tr>
            </thead>
            <tbody id="history-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
